[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athyr"
version = "0.1.0"
description = "Python SDK for Athyr - AI agent runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Athyr", email = "dev@athyr.tech" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["athyr", "ai", "agents", "llm", "grpc"]

dependencies = [
    "grpcio>=1.60.0",
    "googleapis-common-protos>=1.60.0",
    "protobuf>=4.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "googleapis-common-protos>=1.60.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mypy-protobuf>=3.0.0",
]

[project.urls]
Homepage = "https://athyr.enkitech.de"
Documentation = "https://athyr.enkitech.de/docs"
Repository = "https://github.com/athyr-tech/athyr-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["athyr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]